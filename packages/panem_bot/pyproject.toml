[project]
name = "panem-bot"
version = "0.1.0"
description = "discord.py client: gateway, app commands, forum channels, proxying, staff tools"
requires-python = ">=3.14"
dependencies = [
    "panem-shared",
    "discord.py>=2.4",
    "redis>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panem_bot"]

[tool.uv.sources]
panem-shared = { workspace = true }
