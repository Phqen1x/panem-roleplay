[project]
name = "panem-api"
version = "0.1.0"
description = "FastAPI REST + WebSocket bridge for the Activity and staff dashboard (Phase 5+)"
requires-python = ">=3.14"
dependencies = [
    "panem-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5.1",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panem_api"]

[tool.uv.sources]
panem-shared = { workspace = true }
