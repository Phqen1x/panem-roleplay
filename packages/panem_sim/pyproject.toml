[project]
name = "panem-sim"
version = "0.1.0"
description = "World tick loop, economy, NPC AI, dialogue providers (Phase 1+)"
requires-python = ">=3.14"
dependencies = [
    "panem-shared",
    "redis>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panem_sim"]

[tool.uv.sources]
panem-shared = { workspace = true }
