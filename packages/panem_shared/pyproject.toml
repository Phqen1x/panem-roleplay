[project]
name = "panem-shared"
version = "0.1.0"
description = "Shared pydantic models, enums, constants, YAML loaders, event types"
requires-python = ">=3.14"
dependencies = [
    # pydantic>=2.12.4 (and all of 2.13) calls typing._eval_type with a
    # `prefer_fwd_module` kwarg that CPython 3.14 only grew after rc2;
    # unpin once the deployment interpreter is past 3.14.0rc2.
    "pydantic==2.12.3",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panem_shared"]
