# model (`static/assets3d/pets/animal-{model}.glb`). Prices sit in the same
# small-number economy as `data/goods.yaml` (median job wage 15, starting
# money 40): common companions are an easy impulse buy, the Capitol's more
# exotic imports cost a season's wages.
