- id: d1_npc_001
  district: 1
  name: Zinnia Grimshaw
  age: 36
  black_market_contact: true
  job_id: d1_jeweler
  home_location_id: residential
  traits:
  - cheerful
  - stoic
  backstory: Nobody in Zinnia Grimshaw's family has ever left District One; the luxury goods work runs
    in the blood, generation after generation. Zinnia Grimshaw took up work as a Jeweler at The Jewelers'
    Workshop -- steady enough, if nothing to brag about. Zinnia Grimshaw somehow keeps smiling no matter
    how the week's gone, and doesn't say much, and what little they do say tends to be the truth.
  appearance: A 36-year-old who still moves like someone half that age.
- id: d1_npc_002
