  home_location_id: residential
  traits:
  - cowardly
  - reckless
  backstory: Lyra Hollow's earliest memory is the smell of luxury goods work -- District One doesn't let
    you forget what feeds it. Lyra Hollow spends most days as a Clerk, putting in hours at Justice Building
    like everyone else on the block. Lyra Hollow keeps to the back of any crowd, just in case, and takes
    chances that make their neighbors wince.
  appearance: A 31-year-old who still moves like someone half that age.
