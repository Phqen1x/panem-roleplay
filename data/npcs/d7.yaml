- id: d7_npc_001
  district: 7
  name: Briar Ironside
  age: 57
  job_id: d7_lumberjack
  home_location_id: residential
  traits:
  - cheerful
  - paranoid
  backstory: Nobody in Briar Ironside's family has ever left District Seven; the lumber work runs in the
    blood, generation after generation. These days Briar Ironside works as a Lumberjack at The Sawmill,
    and has the calluses to prove it. Briar Ironside somehow keeps smiling no matter how the week's gone,
    and checks over their shoulder more than anyone should have to.
  appearance: A 57-year-old with lumber-worn hands and tired eyes.
