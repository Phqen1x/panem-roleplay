  home_location_id: residential
  traits:
  - kind
  - patient
  backstory: Elin Thistledown's earliest memory is the smell of fish work -- District Four doesn't let
    you forget what feeds it. These days Elin Thistledown works as a Netcaster at The Docks, and has the
    calluses to prove it. Elin Thistledown will give away a meal they can't spare without a second thought,
    and can outwait anyone, on anything.
  appearance: 31 years old, lean and weathered from years of fish work.
