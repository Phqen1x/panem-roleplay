- id: d4_npc_001
  district: 4
  name: Jory Drummond
  age: 26
  job_id: d4_clerk
  home_location_id: residential
  traits:
  - cowardly
  - lazy
  backstory: Jory Drummond grew up in District Four's back streets, the kind of fish household where everyone
    pitches in young. These days Jory Drummond works as a Clerk at Justice Building, and has the calluses
    to prove it. Jory Drummond keeps to the back of any crowd, just in case, and does exactly as much
    as gets by, and not a step more.
  appearance: 26 years old, lean and weathered from years of fish work.
