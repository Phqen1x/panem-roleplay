  name: Junia Blackwell
  age: 52
  job_id: d8_weaver
  home_location_id: residential
  traits:
  - kind
  - proud
  backstory: Junia Blackwell came up in a exhausted corner of District Eight, one of the many faces the
    textiles trade never seems to run short of. These days Junia Blackwell works as a Weaver at The Weaving
    Floor, and has the calluses to prove it. Junia Blackwell will give away a meal they can't spare without
    a second thought, and won't ask for help even when they plainly need it.
  appearance: 52 years old, lean and weathered from years of textiles work.
