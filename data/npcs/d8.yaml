- id: d8_npc_001
  district: 8
  name: Corvin Everhart
  age: 28
  black_market_contact: true
  job_id: d8_weaver
  home_location_id: residential
  traits:
  - gentle
  - gossipy
  backstory: Nobody in Corvin Everhart's family has ever left District Eight; the textiles work runs in
    the blood, generation after generation. Corvin Everhart took up work as a Weaver at The Weaving Floor
    -- steady enough, if nothing to brag about. Corvin Everhart handles even strangers like something
    breakable, and knows everyone's business before they've finished telling it.
  appearance: A 28-year-old with textiles-worn hands and tired eyes.
- id: d8_npc_002
  district: 8
  name: Merrick Hollow
  age: 57
  job_id: d8_dyer
  home_location_id: residential
  traits:
  - shy
  - vengeful
  backstory: Merrick Hollow came up in a quietly_defiant corner of District Eight, one of the many faces
    the textiles trade never seems to run short of. Merrick Hollow spends most days as a Dyer, putting
    in hours at The Weaving Floor like everyone else on the block. Merrick Hollow goes quiet the moment
    a stranger's in the room, and doesn't forget a wrong, and doesn't forgive one either.
  appearance: A 57-year-old who still moves like someone half that age.
