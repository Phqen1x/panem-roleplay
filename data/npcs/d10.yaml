  job_id: d10_herder
  home_location_id: residential
  traits:
  - cautious
  - kind
  backstory: Jory Rowntree grew up in District Ten's back streets, the kind of livestock household where
    everyone pitches in young. These days Jory Rowntree works as a Herder at The Stockyards, and has the
    calluses to prove it. Jory Rowntree weighs every decision twice before making it once, and will give
    away a meal they can't spare without a second thought.
  appearance: 19 years old, lean and weathered from years of livestock work.
