  home_location_id: residential
  traits:
  - lazy
  - suspicious
  backstory: Nobody in Emrys Pryce's family has ever left District Nine; the grain work runs in the blood,
    generation after generation. Emrys Pryce took up work as a Miller at The Granary -- steady enough,
    if nothing to brag about. Emrys Pryce does exactly as much as gets by, and not a step more, and trusts
    almost no one, and says so plainly.
  appearance: Looks older than 39 -- District Nine does that to people.
