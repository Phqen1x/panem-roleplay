- id: d6_npc_001
  district: 6
  name: Kellan Marrow
  age: 53
  job_id: d6_dispatcher
  home_location_id: residential
  traits:
  - proud
  - vengeful
  backstory: Kellan Marrow's earliest memory is the smell of transport work -- District Six doesn't let
    you forget what feeds it. Kellan Marrow spends most days as a Rail Dispatcher, putting in hours at
    The Rail Yards like everyone else on the block. Kellan Marrow won't ask for help even when they plainly
    need it, and doesn't forget a wrong, and doesn't forgive one either.
  appearance: Looks older than 53 -- District Six does that to people.
