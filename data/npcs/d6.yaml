  home_location_id: residential
  traits:
  - gentle
  - sharp-tongued
  backstory: Nobody in Tobias Norwich's family has ever left District Six; the transport work runs in
    the blood, generation after generation. These days Tobias Norwich works as a Mechanic at The Rail
    Yards, and has the calluses to prove it. Tobias Norwich handles even strangers like something breakable,
    and has a tongue sharper than most peacekeepers' patience.
  appearance: Looks older than 45 -- District Six does that to people.
