# Per-district seasonal climate (Spec: "Seasons & Weather Events").
# Temperatures are degrees Fahrenheit; `panem_bot.cogs.weather`'s poll
# picks each in-world day's forecast high/low uniformly within that day's
# season range. `inclement` lists which `WeatherKind`s (besides the
# always-available, severity-less rain/snow) this district's season can
# roll, loosely following each district's real-world-inspired geography.
- district_id: 0 # The Capitol -- mountain-ringed, mild
  spring: { low: 50, high: 68 }
  summer: { low: 65, high: 85 }
  autumn: { low: 48, high: 66 }
  winter: { low: 28, high: 45 }
  inclement:
    spring: [thunderstorm]
    summer: [thunderstorm, hailstorm]
    autumn: [windstorm]
    winter: [blizzard]

