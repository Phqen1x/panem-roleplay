name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: panem
          POSTGRES_PASSWORD: panem
          POSTGRES_DB: panem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U panem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://panem:panem@localhost:5432/panem_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.14

      - name: Sync workspace
        run: uv sync --all-packages --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (panem_shared, panem_sim)
        run: uv run mypy packages/panem_shared/src packages/panem_sim/src

      - name: Pytest
        run: uv run pytest --cov=panem_sim --cov=panem_shared --cov=panem_bot --cov-report=term-missing
