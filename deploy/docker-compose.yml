services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: panem
      POSTGRES_PASSWORD: panem
      POSTGRES_DB: panem
    ports:
      # Published to the host so `uv run alembic`/`uv run python -m
      # panem_bot.main` can be run directly on the host (not in a
      # container) against `DATABASE_URL=...@localhost:5432/panem`.
      - "5432:5432"
    volumes:
      - panem_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panem"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["uv", "run", "alembic", "upgrade", "head"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://panem:panem@postgres:5432/panem
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["uv", "run", "python", "-m", "panem_bot.main"]
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://panem:panem@postgres:5432/panem
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  sim:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["uv", "run", "python", "-m", "panem_sim.main"]
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://panem:panem@postgres:5432/panem
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["uv", "run", "python", "-m", "panem_api.main"]
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://panem:panem@postgres:5432/panem
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # caddy (a reverse proxy in front of `api` for TLS/routing in a real
  # deployment) is not implemented yet -- `api` is reachable directly on
  # :8000 in the meantime, with no auth in front of it (see the README's
  # Milestone H notes).

volumes:
  panem_pg_data:
